# NGINX Load Balancer Configuration for Socket.IO
# Running in Docker container

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    upstream realtime_backend {
        # SMARTER ROUTING: Hash based on IP + User Agent
        # Why? 
        # 1. 'ip_hash' sends all users from one WiFi (Same IP) to the same server (Overload!)
        # 2. Adding 'User Agent' helps split them up if they use different browsers/devices.
        # 3. 'consistent' ensures minimal reshuffling if a server goes down.
        hash $remote_addr$http_user_agent consistent;

        server host.docker.internal:3001 max_fails=3 fail_timeout=30s;
        server host.docker.internal:3011 max_fails=3 fail_timeout=30s;
        server host.docker.internal:3012 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 3000;  # Frontend will connect to this port
        server_name localhost;

        # Increase timeouts for WebSocket connections
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;

        location / {
            proxy_pass http://realtime_backend;
            
            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Preserve client info
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

